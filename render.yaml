services:

  - type: web
    name: university-research-api
    runtime: python
    rootDir: backend

    buildCommand: pip install -r requirements.txt

    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT

    envVars:
      - key: DATABASE_URL
        sync: false

      - key: SECRET_KEY
        sync: false

      - key: CORS_ORIGINS
        sync: false


  - type: cron
    name: university-research-etl
    runtime: python
    rootDir: backend

    schedule: "0 19 * * *"

    buildCommand: pip install -r requirements.txt

    startCommand: python -m app.etl.run_once

    envVars:
      - key: DATABASE_URL
        sync: false

      - key: SECRET_KEY
        sync: false
